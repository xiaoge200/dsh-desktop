<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/settings.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="设置">设置 - DSH 工作台</title>
    <script type="module" src="/src/settings.ts" defer></script>
    <script type="module" src="/src/plugins.ts" defer></script>
  </head>

  <body>
    <main class="settings">
      <header class="settings-header">
        <img src="/src/assets/whale.png" class="logo" alt="DSH" />
        <div>
          <h1 data-i18n="设置">设置</h1>
          <p class="subtitle">DSH 工作台</p>
        </div>
      </header>

      <section class="card">
        <h2 data-i18n="启动">启动</h2>
        <div class="row">
          <div class="row-text">
            <span class="label" data-i18n="开机自动启动">开机自动启动</span>
            <span class="hint" data-i18n="电脑开机后自动打开 DSH 工作台">电脑开机后自动打开 DSH 工作台</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="autostart" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="row">
          <div class="row-text">
            <span class="label" data-i18n="自动更新">自动更新</span>
            <span class="hint" data-i18n="有新版本时自动更新，让你始终用上最新功能">有新版本时自动更新，让你始终用上最新功能</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="auto-update" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="row">
          <div class="row-text">
            <span class="label" data-i18n="更新预发布版本">更新预发布版本</span>
            <span class="hint" data-i18n="更新预发布版本提示">开启后检查与自动更新也包含预发布版本（如 beta / rc）</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="pre-release" />
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="服务">服务</h2>
        <div class="row">
          <div class="row-text">
            <span class="label" data-i18n="本地服务">本地服务</span>
            <span class="hint" id="service-state">正在检查…</span>
          </div>
          <button class="btn" id="restart-btn" data-i18n="重启服务">重启服务</button>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="插件">插件</h2>
        <div class="tabs">
          <button class="tab-btn active" id="tab-installed" data-i18n="已安装">已安装</button>
          <button class="tab-btn" id="tab-market" data-i18n="应用市场">应用市场</button>
        </div>

        <div id="pane-installed">
          <div class="status-line" id="plugin-status" hidden></div>
          <div class="row add-plugin">
            <input id="plugin-spec-input" class="text-input" data-i18n-placeholder="插件输入提示"
              placeholder="npm 包名 / github:owner/repo / 本地绝对路径" />
            <button class="btn" id="plugin-add-btn" data-i18n="安装">安装</button>
          </div>
          <div id="plugin-list"></div>
        </div>

        <div id="pane-market" hidden>
          <div class="row add-plugin">
            <input id="market-search-input" class="text-input" data-i18n-placeholder="搜索插件…" placeholder="搜索插件…" />
            <button class="btn" id="market-refresh-btn" data-i18n="刷新">刷新</button>
          </div>
          <div class="error-banner" id="market-errors" hidden></div>
          <div class="market-list" id="market-list"></div>
        </div>
      </section>

      <section class="card">
        <details class="advanced">
          <summary data-i18n="高级">高级</summary>
          <div class="row">
            <div class="row-text">
              <span class="label" data-i18n="本地端口">本地端口</span>
              <span class="hint" data-i18n="端口提示">端口被占用时会自动更换；0 表示自动</span>
            </div>
            <input type="number" id="port-input" class="num-input" min="0" max="65535" placeholder="3080" />
          </div>
          <div class="row">
            <div class="row-text">
              <span class="label" data-i18n="更新源">更新源</span>
              <span class="hint" data-i18n="更新源提示">国内网络建议选择国内镜像</span>
            </div>
            <select id="registry-select" class="select">
              <option value="auto" data-i18n="自动">自动</option>
              <option value="npmjs" data-i18n="官方源">官方源</option>
              <option value="npmmirror" data-i18n="国内镜像">国内镜像</option>
            </select>
          </div>
          <div class="row actions">
            <button class="btn" id="advanced-save-btn" data-i18n="保存">保存</button>
            <span class="hint" id="advanced-save-state"></span>
          </div>
        </details>
      </section>

      <section class="card">
        <h2 data-i18n="关于">关于</h2>
        <div class="about-row about-update-row">
          <div class="about-update-text">
            <span class="label" data-i18n="应用版本">应用版本</span>
            <span id="app-update-state" class="hint">-</span>
          </div>
          <div class="about-update-actions">
            <span id="app-version">-</span>
            <button class="btn btn-small" id="app-check-update-btn" data-i18n="检查更新">检查更新</button>
            <button class="btn btn-small" id="app-apply-update-btn" data-i18n="立即更新" hidden>立即更新</button>
          </div>
        </div>
        <div class="about-row about-update-row">
          <div class="about-update-text">
            <span class="label" data-i18n="DSH 版本">DSH 版本</span>
            <span id="dsh-update-state" class="hint">-</span>
          </div>
          <div class="about-update-actions">
            <span id="dsh-version">-</span>
            <button class="btn btn-small" id="check-update-btn" data-i18n="检查更新">检查更新</button>
            <button class="btn btn-small" id="apply-update-btn" data-i18n="立即更新" hidden>立即更新</button>
          </div>
        </div>
        <div class="about-row"><span class="label" data-i18n="运行环境">运行环境</span><span id="node-version">-</span></div>
        <div class="about-row"><span class="label" data-i18n="工作区位置">工作区位置</span><span class="path" id="workspace-path">-</span></div>
        <div class="about-row"><span class="label" data-i18n="日志位置">日志位置</span><span class="path" id="log-path">-</span></div>
        <div class="row actions">
          <button class="btn" id="open-workspace-btn" data-i18n="打开工作区">打开工作区</button>
          <button class="btn" id="open-log-btn" data-i18n="打开日志">打开日志</button>
        </div>
      </section>
    </main>
  </body>
</html>

[package]
name = "dsh-desktop"
version = "0.1.9"
description = "DSH Web desktop client: built-in Node runtime + auto-installed latest dsh package + embedded WebView"
authors = ["dsh-desktop team"]
edition = "2021"
# 本包有两个 bin（壳 + pnpm 原生转发器）。显式声明主程序，避免 tauri CLI /
# cargo run 在"哪个是主程序"上含糊（externalBin 时代它曾直接报 failed to find main binary）。
default-run = "dsh-desktop"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 内置 pnpm 的原生转发器（Windows 上装成 pnpm-home/pnpm.exe，替代批处理 shim）。
# 见 pnpm_env.rs 的 install_shim() 与 docs/IMPLEMENTATION.md §14。
[[bin]]
name = "dsh-pnpm-forwarder"
path = "src/bin/dsh-pnpm-forwarder.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
log = "0.4"
thiserror = "2"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros"] }
open = "5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "wincon", "handleapi", "synchapi", "winnls", "stringapiset", "jobapi2", "tlhelp32", "winnt", "minwindef", "winbase", "winuser", "fileapi", "namedpipeapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

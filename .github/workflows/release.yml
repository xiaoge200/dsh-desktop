# release.yml — 打 tag 后自动构建并发布（Windows / macOS）
#
# 触发方式：
#   1. 更新版本号（tauri.conf.json + Cargo.toml + package.json，保持一致）
#   2. git tag v0.1.0 && git push origin v0.1.0
#   3. Actions 自动构建三份产物，发布为 Draft Release，人工确认后公开
#
# 产物：
#   - Windows:  NSIS per-user 安装包（*-setup.exe）
#   - macOS:    Intel (x64) 与 Apple Silicon (arm64) 的 .app.tar.gz + .dmg
#   - 更新清单: latest.json（由 merge-updater-json 任务合并各平台签名生成）
#
# 可选 Secrets（未配置则跳过对应能力，构建不受影响）：
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     —— updater 签名，缺失则应用内自动更新不可用
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#     —— macOS Developer ID 签名 + 公证，缺失则 dmg 未签名（Gatekeeper 会拦截）

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: macos-15-intel # Intel (x64)
            bundles: app,dmg
          - platform: macos-15 # Apple Silicon (arm64)
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    # secrets 不能用于 job/step 级 if（GitHub 限制），用 job 级 env 传标志供步骤判断
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 下载内置 Node 发行版（nodejs.org 官方源）+ 构建 dsh 基线（npmjs 官方源）
      # resources/node、resources/dsh-baseline 不入库，每平台各自生成
      - name: Prepare bundled resources (Node runtime + dsh baseline)
        shell: pwsh
        run: ./scripts/prepare-resources.ps1 -Registry https://registry.npmjs.org -NodeBase https://nodejs.org/dist

      # macOS 签名/公证：APPLE_* Secret 缺失时不能把空值传给 tauri（会被当成"提供了证书"
      # 去 security import，报 failed to import keychain certificate），因此按证书是否存在拆成两步。
      # 未配置证书 → 无 APPLE_* 环境变量，产出未签名 dmg（首次打开右键 →「打开」）。
      - name: Build & publish release assets (unsigned)
        if: env.HAS_APPLE_CERT == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名（缺失则跳过签名与更新清单，构建仍成功）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'DSH 工作台 v__VERSION__'
          releaseBody: |
            ## DSH 工作台 v__VERSION__

            本版本由 GitHub Actions 自动构建。

            - **Windows**：`*-setup.exe`（NSIS，免管理员安装）
            - **macOS Intel**：`*-x64.dmg`
            - **macOS Apple Silicon**：`*-aarch64.dmg`

            > macOS 安装包在未配置签名/公证前为未签名版本，首次打开请右键 →「打开」。
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Build & publish release assets (signed)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'DSH 工作台 v__VERSION__'
          releaseBody: |
            ## DSH 工作台 v__VERSION__

            本版本由 GitHub Actions 自动构建。

            - **Windows**：`*-setup.exe`（NSIS，免管理员安装）
            - **macOS Intel**：`*-x64.dmg`
            - **macOS Apple Silicon**：`*-aarch64.dmg`
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  # tauri-action 的 latest.json 在多平台矩阵下会互相覆盖（tauri-apps/tauri-action#409、#927），
  # 因此这里统一由本任务基于各平台 .sig 签名文件合并生成完整的更新清单。
  # 注意：secrets 不能用于 job 级 if（GitHub 限制），改为 job 级 env 传标志，各步骤按标志跳过。
  merge-updater-json:
    name: Merge updater manifest (latest.json)
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_SIGNING_KEY == 'true'

      - name: Resolve tag & repo
        id: meta
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf assets && mkdir -p assets
          gh release download "${{ steps.meta.outputs.tag }}" --dir assets --clobber

      - name: Merge latest.json
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          node scripts/merge-updater-json.mjs \
            --assets assets \
            --repo "${{ steps.meta.outputs.repo }}" \
            --tag "${{ steps.meta.outputs.tag }}"

      - name: Upload latest.json
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" assets/latest.json --clobber

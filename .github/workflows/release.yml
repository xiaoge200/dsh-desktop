# release.yml — 打 tag 后自动构建并发布（Windows / macOS / Linux）
#
# 架构（对比 tauri-action 直传 release 更稳，重跑幂等）：
#   1. build 矩阵：各平台只构建产物（tauri-action 不传 tagName，不碰 release），
#      汇总 bundle 产物上传为 workflow artifact；
#   2. release job：下载全部产物 → 按平台加数字前缀（01-Win / 02-macOS / 03-Linux，
#      GitHub Releases UI 按文件名字母序排列，前缀保证分组顺序）→
#      有签名密钥时用 merge-updater-json.mjs 重建 latest.json →
#      softprops/action-gh-release 一次性创建草稿并上传（overwrite 默认开，
#      重跑/移动 tag 不会再有 already_exists）。
#
# 触发方式：
#   1. 更新版本号（tauri.conf.json + Cargo.toml + package.json，保持一致）
#   2. git tag v0.1.0 && git push origin v0.1.0
#   3. Actions 自动构建全部产物，发布为 Draft Release，人工确认后公开
#   （也可 workflow_dispatch 手动触发：tag 不存在时会基于当前提交自动创建）
#
# macOS 说明：x86_64 在 arm64 的 macos-latest 上交叉编译（--target x86_64-apple-darwin），
#   DMG 由宿主机（arm64，已验证稳定）生成，绕开 Intel runner 的 create-dmg 兼容问题。
# MSI 说明：WiX 语言 zh-CN（代码页 936），规避默认 en-US 代码页 1252 不支持
#   中文 productName 导致 light.exe 失败（tauri#8363）。
#
# 可选 Secrets（未配置则跳过对应能力，构建不受影响）：
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     —— updater 签名，缺失则跳过 latest.json 与 .sig（应用内自动更新不可用）
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#     —— macOS Developer ID 签名 + 公证，缺失则产物未签名（Gatekeeper 会拦截）

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi'
            label: windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            label: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            label: macos-x86_64
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
            label: linux-amd64
          - platform: ubuntu-22.04-arm
            # Linux ARM64：GitHub 官方 ARM64 托管 runner 原生构建
            # （AppImage 工具链不支持 x86→arm64 交叉编译）
            args: '--bundles appimage,deb,rpm'
            label: linux-aarch64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    # secrets 不能用于 job/step 级 if（GitHub 限制），用 job 级 env 传标志供步骤判断
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 缓存 target 目录（macOS 交叉编译两个 target、Linux 均需要）
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # libfuse2：Ubuntu 22.04 默认无 FUSE2，AppImage（linuxdeploy）需要它才能运行
          # xdg-utils：提供 /usr/bin/xdg-open（tauri 打包 AppImage 时需要，精简的 arm runner 缺）
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libdpkg-dev rpm libfuse2 xdg-utils

      - name: Install PowerShell (Linux, for prepare-resources)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          command -v pwsh || sudo snap install powershell --classic

      - name: Install frontend dependencies
        run: npm ci

      # 下载内置 Node 发行版（nodejs.org 官方源）+ 构建 dsh 基线（npmjs 官方源）
      # resources/node、resources/dsh-baseline 不入库，每平台各自生成
      - name: Prepare bundled resources (Node runtime + dsh baseline)
        shell: pwsh
        run: ./scripts/prepare-resources.ps1 -Registry https://registry.npmjs.org -NodeBase https://nodejs.org/dist

      # macOS 签名/公证：APPLE_* Secret 缺失时不能把空值传给 tauri（会被当成"提供了证书"
      # 去 security import，报 failed to import keychain certificate），因此按证书是否存在拆成两步。
      # 未配置证书 → 无 APPLE_* 环境变量，产出未签名产物（macOS 首次打开右键 →「打开」）。
      # 只构建不发布：不传 tagName，tauri-action 不会创建/上传 Release。
      - name: Build & upload build artifacts (unsigned)
        if: env.HAS_APPLE_CERT == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名（缺失则跳过签名与更新清单，构建仍成功）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 显式 CI=true：让 create-dmg 跳过 AppleScript 图标排版（无头 CI 上会 -10826）
          CI: "true"
          # linuxdeploy 的 AppImage 不解压 FUSE 直接运行（配合 libfuse2 双保险）
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy 会对 AppDir 内的二进制再 strip 一次；release 二进制已在链接期
          # strip（Cargo.toml [profile.release] strip=true），新版 linuxdeploy 对
          # 已 strip 的 ELF 会崩溃（std::logic_error → "failed to run linuxdeploy"），
          # NO_STRIP=true 让 linuxdeploy 跳过 strip 步骤
          NO_STRIP: "true"
        with:
          args: ${{ matrix.args }}

      - name: Build & upload build artifacts (signed)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # 同上：跳过 linuxdeploy 对已 strip 二进制（Cargo.toml strip=true）的二次 strip，避免崩溃
          NO_STRIP: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      # 汇总所有 bundle 产物（含 .sig 签名）到 release-assets/
      # （macOS 交叉编译时产物在 target/<target-triple>/release/bundle 下，find 全覆盖）
      - name: Stage bundle outputs
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target -path '*/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.exe.sig' \
               -o -name '*.msi' -o -name '*.msi.sig' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*.deb' -o -name '*.deb.sig' \
               -o -name '*.rpm' -o -name '*.rpm.sig' \
               -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -exec cp -f {} release-assets/ \;
          echo "=== Staged assets (${{ matrix.label }}) ==="
          ls -la release-assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_OUTPUT" <<EOF
          RELEASE_BODY<<GITCLIFF_EOF
          ## DSH 工作台 v${VERSION}

          本版本由 GitHub Actions 自动构建。

          - **Windows**：\`*-setup.exe\`（NSIS，免管理员安装）/ \`*-x64.msi\`（MSI）
          - **macOS**：\`*-x64.dmg\`（Intel）/ \`*-aarch64.dmg\`（Apple Silicon）
          - **Linux**：\`*_amd64.deb\`、\`*_amd64.AppImage\`、\`*_arm64.deb\`、\`*_arm64.AppImage\`

          > macOS 安装包在未配置签名/公证前为未签名版本，首次打开请右键 →「打开」。
          GITCLIFF_EOF
          EOF

      # 一次下载全部构建产物（v4 不带 name 会按 artifact 名分目录解包到 assets/）
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      # 按平台加前缀：Windows→01- / macOS→02- / Linux→03-，保证 Releases 页分组排序
      - name: Rename assets with platform order prefixes
        shell: bash
        run: |
          mkdir -p ordered-assets
          prefix_dir() {
            local prefix="$1"; shift
            for d in "$@"; do
              [ -d "assets/$d" ] || continue
              for f in assets/$d/*; do
                [ -f "$f" ] || continue
                cp -f "$f" "ordered-assets/${prefix}$(basename "$f")"
              done
            done
          }
          prefix_dir "01-" bundle-windows
          prefix_dir "02-" bundle-macos-aarch64 bundle-macos-x86_64
          prefix_dir "03-" bundle-linux-amd64 bundle-linux-aarch64
          echo "=== Ordered assets ==="
          ls -la ordered-assets/

      # 有签名密钥时：从 .sig 重建更新清单（url 指向前缀化资源名）
      - name: Generate updater manifest (latest.json)
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          node scripts/merge-updater-json.mjs \
            --assets ordered-assets \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.meta.outputs.tag }}"
          echo "=== latest.json ==="
          cat ordered-assets/latest.json

      # 一次性创建草稿 Release 并按前缀顺序上传全部资源。
      # softprops overwrite 默认开启：重跑/移动 tag 时覆盖同名资产，幂等。
      - name: Create draft release & upload assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          # workflow_dispatch 触发时 tag 尚不存在，基于当前提交创建
          target_commitish: ${{ github.sha }}
          name: DSH 工作台 v${{ steps.meta.outputs.version }}
          body: ${{ steps.meta.outputs.RELEASE_BODY }}
          draft: true
          prerelease: false
          preserve_order: true
          files: |
            ordered-assets/01-*
            ordered-assets/02-*
            ordered-assets/03-*
            ordered-assets/latest.json
          fail_on_unmatched_files: false

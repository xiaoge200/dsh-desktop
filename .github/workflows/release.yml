# release.yml — 打 tag 后自动构建并发布（Windows / macOS / Linux）
# 触发：三处版本号一致（tauri.conf.json/Cargo.toml/package.json）→ git tag v0.1.0
#   → git push origin v0.1.0（或 workflow_dispatch：tag 不存在时自动基于当前提交创建）
# 架构：build 矩阵只产 artifact（不碰 release）→ release job 按平台加前缀
#   （01-Win/02-macOS/03-Linux，保证 Releases 页分组顺序）后创建草稿并上传（重跑幂等）；
#   有签名密钥时重建 latest.json（updater 清单）。
# macOS：x86_64 在 arm64 runner 交叉编译；MSI：WiX 语言 zh-CN（代码页 936）处理中文 productName。
# Secrets（缺失则跳过对应能力）：
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) — updater 签名，缺失则无 .sig/latest.json
#   APPLE_* — macOS 签名+公证，缺失则 macOS 产物未签名

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi'
            label: windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            label: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            label: macos-x86_64
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
            label: linux-amd64
          - platform: ubuntu-22.04-arm
            # AppImage 工具链不支持交叉编译，用官方 ARM64 runner 原生构建
            args: '--bundles appimage,deb,rpm'
            label: linux-aarch64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    # secrets 不能用于 if：用 job 级 env 传标志
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 缓存 target 目录（macOS 交叉编译两个 target、Linux 均需要）
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdpkg-dev \
            rpm \
            libfuse2 \
            xdg-utils \
            file \
            squashfs-tools \
            xvfb \
            libglib2.0-bin \
            build-essential \
            gdk-pixbuf2.0-bin \
            librsvg2-common

      - name: Refresh GTK loaders
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          echo "=== GDK Pixbuf loader ==="
          command -v gdk-pixbuf-query-loaders || true
          find /usr -name 'gdk-pixbuf-query-loaders*' -type f 2>/dev/null || true

          if command -v gdk-pixbuf-query-loaders >/dev/null 2>&1; then
            gdk-pixbuf-query-loaders --update-cache
          else
            echo "WARNING: gdk-pixbuf-query-loaders not found; skipping cache refresh"
          fi
      - name: Install PowerShell (Linux, for prepare-resources)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          command -v pwsh || sudo snap install powershell --classic

      - name: Install frontend dependencies
        run: npm ci

      # 生成不入库的 resources/node + resources/dsh-baseline
      - name: Prepare bundled resources (Node runtime + dsh baseline)
        shell: pwsh
        run: ./scripts/prepare-resources.ps1 -Registry https://registry.npmjs.org -NodeBase https://nodejs.org/dist

      # 按证书是否存在拆两步：无证书时不能传空 APPLE_* 给 tauri（会被误认为提供了证书）。
      # 只构建不发布：不传 tagName，tauri-action 不创建/上传 Release。
      - name: Build & upload build artifacts (unsigned)
        if: env.HAS_APPLE_CERT == 'false' && !startsWith(matrix.platform, 'ubuntu')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CI=true：无头 CI 上 create-dmg 跳过 AppleScript 图标排版（-10826）
          CI: "true"
          # AppImage 打包：不解压 FUSE 直接运行、不再二次 strip（release 已 strip，再 strip 会崩）
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        with:
          args: ${{ matrix.args }}

      - name: Build & upload build artifacts (signed)
        if: env.HAS_APPLE_CERT == 'true' && !startsWith(matrix.platform, 'ubuntu')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage 打包环境同 unsigned 步
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      # Linux 不走 action（v0 无 exec 入参套不了 xvfb-run），改脚本直调 CLI 包 xvfb-run
      - name: Build Linux bundles (xvfb-run)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: "true"
          RUST_BACKTRACE: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: |
          echo "=== Environment ==="
          uname -a
          uname -m
          rustc --version
          cargo --version

          echo "=== GTK / GDK Pixbuf ==="
          pkg-config --modversion gtk+-3.0 || true
          pkg-config --modversion gdk-pixbuf-2.0 || true
          gdk-pixbuf-query-loaders --version || true

          echo "=== Build ==="
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1024x768x24" \
            npm run tauri build -- ${{ matrix.args }} --verbose

      # 汇总所有 bundle 产物（含 .sig）→ release-assets/，find 全覆盖各 target
      - name: Stage bundle outputs
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target -path '*/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.exe.sig' \
               -o -name '*.msi' -o -name '*.msi.sig' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*.deb' -o -name '*.deb.sig' \
               -o -name '*.rpm' -o -name '*.rpm.sig' \
               -o -name '*.AppImage' -o -name '*.AppImage.sig' \) \
            -exec cp -f {} release-assets/ \;
          echo "=== Staged assets (${{ matrix.label }}) ==="
          ls -la release-assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          cat >> "$GITHUB_OUTPUT" <<EOF
          RELEASE_BODY<<GITCLIFF_EOF
          ## DSH 工作台 v${VERSION}

          本版本由 GitHub Actions 自动构建。

          - **Windows**：\`*-setup.exe\`（NSIS，免管理员安装）/ \`*-x64.msi\`（MSI）
          - **macOS**：\`*-x64.dmg\`（Intel）/ \`*-aarch64.dmg\`（Apple Silicon）
          - **Linux**：\`*_amd64.deb\`、\`*_amd64.AppImage\`、\`*_arm64.deb\`、\`*_arm64.AppImage\`

          > macOS 安装包在未配置签名/公证前为未签名版本，首次打开请右键 →「打开」。
          GITCLIFF_EOF
          EOF

      # v4 不带 name 会按 artifact 名分目录解包到 assets/
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      # 按平台加前缀：Windows→01- / macOS→02- / Linux→03-，保证 Releases 页分组排序
      - name: Rename assets with platform order prefixes
        shell: bash
        run: |
          mkdir -p ordered-assets
          prefix_dir() {
            local prefix="$1"; shift
            for d in "$@"; do
              [ -d "assets/$d" ] || continue
              for f in assets/$d/*; do
                [ -f "$f" ] || continue
                cp -f "$f" "ordered-assets/${prefix}$(basename "$f")"
              done
            done
          }
          prefix_dir "01-" bundle-windows
          prefix_dir "02-" bundle-macos-aarch64 bundle-macos-x86_64
          prefix_dir "03-" bundle-linux-amd64 bundle-linux-aarch64
          echo "=== Ordered assets ==="
          ls -la ordered-assets/

      # 有签名密钥时：从 .sig 重建更新清单（url 指向前缀化资源名）
      - name: Generate updater manifest (latest.json)
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          node scripts/merge-updater-json.mjs \
            --assets ordered-assets \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.meta.outputs.tag }}"
          echo "=== latest.json ==="
          cat ordered-assets/latest.json

      # 创建草稿 Release 并上传（overwrite 默认开，重跑/移动 tag 幂等）
      - name: Create draft release & upload assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          # workflow_dispatch 触发时 tag 尚不存在，基于当前提交创建
          target_commitish: ${{ github.sha }}
          name: DSH 工作台 v${{ steps.meta.outputs.version }}
          body: ${{ steps.meta.outputs.RELEASE_BODY }}
          draft: true
          prerelease: false
          preserve_order: true
          files: |
            ordered-assets/01-*
            ordered-assets/02-*
            ordered-assets/03-*
            ordered-assets/latest.json
          fail_on_unmatched_files: false

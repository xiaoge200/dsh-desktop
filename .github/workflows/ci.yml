# ci.yml — PR / main 分支的快速编译检查（不打包、不发版）
#
# 只做编译验证（tauri build --no-bundle），跑在 Windows 与 macOS 上；
# 发布打包见 .github/workflows/release.yml。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Compile check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build 在编译期会校验 bundle.resources 路径存在（resources/node、resources/dsh-baseline
      # 不入库，由 prepare-resources.ps1 在打包时生成）。编译检查不打包，建空目录占位即可通过校验。
      # 注意：必须用 bash（Windows 默认 powershell 的 mkdir 不认 -p 多参数语法）
      - name: Create placeholder resource dirs (compile check only)
        shell: bash
        run: |
          mkdir -p resources/node resources/dsh-baseline

      - name: Compile check (no bundle)
        run: npm run tauri build -- --no-bundle
